<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Gallery · URSPACE</title>
<meta name="description" content="Development projects reshaping Korean cities, and closed schools waiting for new design ideas.">
<meta name="theme-color" content="#0B4F24">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261015g">
</head>
<body data-page="gallery" data-title="gallery.title">
<div id="site-header"></div>

<main id="main">
  <header class="page-head">
    <div class="grid-bg grid-fade" aria-hidden="true"></div>
    <div class="wrap">
      <h1 data-i18n="gallery.title"></h1>
      <p class="lede" data-i18n="gallery.lede"></p>
      <nav class="anchor-tabs" aria-label="Sections">
        <a href="#projects"><span data-i18n="gallery.tabProjects"></span><span id="n-projects"></span></a>
        <a href="#sites"><span data-i18n="gallery.tabSites"></span><span id="n-sites"></span></a>
      </nav>
    </div>
  </header>

  <section class="section" id="projects" style="padding-top:48px;scroll-margin-top:90px">
    <div class="wrap">
      <div class="section-head" style="margin-bottom:22px">
        <div>
          <h2 data-i18n="gallery.projectsTitle"></h2>
          <p data-i18n="gallery.projectsLede"></p>
        </div>
      </div>
      <div class="toolbar">
        <div class="chips" id="region-chips" role="group" aria-label="Filter by region"></div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" data-i18n-ph="gallery.search" data-i18n-aria="gallery.search">
        </label>
      </div>
      <p class="count" id="count" aria-live="polite" style="margin-bottom:16px"></p>
      <div class="grid-3" id="project-grid"></div>
    </div>
  </section>

  <section class="section tint" id="sites" style="scroll-margin-top:70px">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="gallery.sitesTitle"></h2>
          <p data-i18n="gallery.sitesLede"></p>
        </div>
      </div>
      <div class="site-list" id="site-list"></div>
    </div>
  </section>
</main>

<div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" aria-hidden="true">
  <div class="modal-card">
    <button type="button" class="modal-close" id="pm-close" data-i18n-aria="common.close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="pm-content"></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/config.js?v=20261015e"></script>
<script src="assets/js/i18n.js?v=20261015e"></script>
<script src="assets/js/services.js?v=20261015e"></script>
<script src="assets/js/layout.js?v=20261015e"></script>
<script src="assets/js/data-places.js?v=20261015e"></script>
<script src="assets/js/pages/gallery.js?v=20261015e"></script>
</body>
</html>
