<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · URSPACE</title>
<meta name="theme-color" content="#0B4F24">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261015e">
</head>
<body data-page="login" data-no-join data-title="login.title">
<div id="site-header"></div>

<main id="main" class="auth">
  <div class="wrap" style="display:flex;justify-content:center">
    <div class="form-card">
      <form id="form-login" novalidate>
        <h1 data-i18n="login.title"></h1>
        <p class="intro" data-i18n="login.intro"></p>
        <div class="notice" data-demo-note="auth" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span data-i18n="common.demo"></span></div>
        <button type="button" class="btn-google" data-google>
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          <span data-i18n="login.google"></span>
        </button>
        <p class="form-msg info" data-google-msg role="status" hidden data-i18n="login.googleSoon"></p>
        <div class="or"><span data-i18n="login.or"></span></div>
        <p class="err" id="login-err" role="alert" style="margin:-6px 0 16px" data-i18n="err.login"></p>
        <div class="field" data-required data-email>
          <label for="l-email"><span data-i18n="apply.email"></span><span class="req" aria-hidden="true">*</span></label>
          <input class="input" id="l-email" name="email" type="email" autocomplete="email" required>
          <p class="err" data-i18n="err.email"></p>
        </div>
        <div class="field" data-required>
          <label for="l-pw"><span data-i18n="login.password"></span><span class="req" aria-hidden="true">*</span></label>
          <div class="pw">
            <input class="input" id="l-pw" name="password" type="password" autocomplete="current-password" required>
            <button type="button" data-toggle-pw data-i18n-aria="login.show"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="err" data-i18n="err.required"></p>
        </div>
        <div class="form-row-end"><a href="#" id="forgot" data-i18n="login.forgot"></a></div>
        <p class="form-msg info" id="forgot-msg" role="status" hidden data-i18n="forgot.sent"></p>
        <div class="form-actions"><button class="btn block" type="submit" data-i18n="login.submit"></button></div>
        <p class="form-foot"><span data-i18n="login.noAccount"></span> <a class="textlink" href="signup.html" id="to-signup" data-i18n="login.signup"></a></p>
        <p class="agree" data-i18n-html="legal.agreeSignup"></p>
      </form>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js?v=20261015e"></script>
<script src="assets/js/i18n.js?v=20261015e"></script>
<script src="assets/js/services.js?v=20261015e"></script>
<script src="assets/js/layout.js?v=20261015e"></script>
<script src="assets/js/forms.js?v=20261015e"></script>
<script src="assets/js/pages/auth.js?v=20261015e"></script>
</body>
</html>
