<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply · URSPACE</title>
<meta name="description" content="Submit a design for a real site, or join the URSPACE education program.">
<meta name="theme-color" content="#0B4F24">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261020d">
</head>
<body data-page="apply" data-no-join data-title="apply.title">
<div id="site-header"></div>

<main id="main">
  <header class="page-head">
    <div class="grid-bg grid-fade" aria-hidden="true"></div>
    <div class="wrap">
      <h1 data-i18n="apply.title"></h1>
      <p class="lede" data-i18n="apply.lede"></p>
    </div>
  </header>

  <div class="wrap">
    <div class="apply-layout">
      <aside class="apply-aside" aria-live="polite">
        <div class="media">
          <span class="tag"><span class="pin"></span><span id="aside-tag"></span></span>
          <img id="aside-img" src="assets/img/program-space-matching.webp" alt="" width="1000" height="667">
        </div>
        <div>
          <h2 id="aside-title"></h2>
          <p id="aside-body"></p>
          <a class="textlink" id="aside-link" href="gallery.html#sites"></a>
        </div>
      </aside>

      <div class="apply-main">
        <div class="seg" role="tablist" aria-label="Application type">
          <button type="button" role="tab" id="tab-design" aria-controls="panel-design" aria-selected="true" data-tab="design" data-i18n="apply.tabDesign"></button>
          <button type="button" role="tab" id="tab-education" aria-controls="panel-education" aria-selected="false" data-tab="education" data-i18n="apply.tabEdu"></button>
        </div>

      <!-- Upload design -->
      <div class="form-card" role="tabpanel" id="panel-design" aria-labelledby="tab-design">
        <form id="form-design" novalidate>
          <h2 data-i18n="apply.design.title"></h2>
          <p class="intro" data-i18n="apply.design.intro"></p>
          <div class="notice" data-demo-note hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span data-i18n="common.demo"></span></div>

          <div class="field" data-required>
            <label for="d-designer"><span data-i18n="apply.designer"></span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="d-designer" name="designer" autocomplete="name" required>
            <p class="err" data-i18n="err.required"></p>
          </div>
          <div class="field" data-required>
            <label for="d-location"><span data-i18n="apply.location"></span><span class="req" aria-hidden="true">*</span></label>
            <select class="select" id="d-location" name="location" required></select>
            <p class="err" data-i18n="err.required"></p>
          </div>
          <div class="field" data-required>
            <label for="d-name"><span data-i18n="apply.designName"></span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="d-name" name="designName" required>
            <p class="err" data-i18n="err.required"></p>
          </div>
          <div class="field" data-required>
            <label for="d-desc"><span data-i18n="apply.description"></span><span class="req" aria-hidden="true">*</span></label>
            <textarea class="textarea" id="d-desc" name="description" data-i18n-ph="apply.descriptionPh" required></textarea>
            <p class="err" data-i18n="err.required"></p>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="d-phone"><span data-i18n="apply.phone"></span><span class="opt" data-i18n="apply.optional"></span></label>
              <input class="input" id="d-phone" name="phone" type="tel" autocomplete="tel">
            </div>
            <div class="field" data-required data-email>
              <label for="d-email"><span data-i18n="apply.email"></span><span class="req" aria-hidden="true">*</span></label>
              <input class="input" id="d-email" name="email" type="email" autocomplete="email" required>
              <p class="err" data-i18n="err.email"></p>
            </div>
          </div>
          <div class="field" data-file>
            <span class="label"><span data-i18n="apply.upload"></span><span class="req" aria-hidden="true">*</span></span>
            <p class="hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span data-i18n="apply.uploadHint"></span></p>
            <div class="drop" id="drop">
              <input type="file" id="d-file" accept="image/*,.pdf" aria-describedby="drop-types">
              <strong data-i18n="apply.drop"></strong>
              <span id="drop-types" data-i18n="apply.dropTypes"></span>
            </div>
            <div class="file-chip" id="file-chip">
              <img id="file-thumb" alt="">
              <div class="meta"><b id="file-name"></b><span id="file-size"></span></div>
              <button type="button" id="file-remove" data-i18n-aria="apply.remove">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
              </button>
            </div>
            <p class="err" id="file-err" data-i18n="err.file"></p>
          </div>
          <div class="form-actions"><button class="btn block" type="submit" data-i18n="apply.submit"></button></div>
          <p class="form-msg error" data-form-error role="alert" hidden></p>
          <p class="agree" data-i18n-html="legal.agreeApply"></p>
        </form>
      </div>

      <!-- Education -->
      <div class="form-card" role="tabpanel" id="panel-education" aria-labelledby="tab-education" hidden>
        <form id="form-education" novalidate>
          <h2 data-i18n="apply.edu.title"></h2>
          <p class="intro" data-i18n="apply.edu.intro"></p>
          <div class="notice" data-demo-note hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span data-i18n="common.demo"></span></div>
          <div class="field" data-required>
            <label for="e-name"><span data-i18n="apply.name"></span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="e-name" name="name" autocomplete="name" required>
            <p class="err" data-i18n="err.required"></p>
          </div>
          <div class="field">
            <label for="e-phone"><span data-i18n="apply.phone"></span><span class="opt" data-i18n="apply.optional"></span></label>
            <input class="input" id="e-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field" data-required data-email>
            <label for="e-email"><span data-i18n="apply.email"></span><span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="e-email" name="email" type="email" autocomplete="email" required>
            <p class="err" data-i18n="err.email"></p>
          </div>
          <div class="form-actions"><button class="btn block" type="submit" data-i18n="apply.submit"></button></div>
          <p class="form-msg error" data-form-error role="alert" hidden></p>
          <p class="agree" data-i18n-html="legal.agreeApply"></p>
        </form>
      </div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js?v=20261020d"></script>
<script src="assets/js/i18n.js?v=20261020d"></script>
<script src="assets/js/services.js?v=20261020d"></script>
<script src="assets/js/layout.js?v=20261020d"></script>
<script src="assets/js/data-places.js?v=20261020d"></script>
<script src="assets/js/forms.js?v=20261020d"></script>
<script src="assets/js/pages/apply.js?v=20261020d"></script>
</body>
</html>
