<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="URSPACE empowers designers to transform unused and abandoned spaces into creative, sustainable places.">

<meta property="og:description" content="URSPACE empowers designers to transform unused and abandoned spaces into creative, sustainable places.">
<meta property="og:image" content="assets/img/home-about.webp">
<meta name="theme-color" content="#0B4F24">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261015e">
</head>
<body data-page="home" data-no-join>
<div id="site-header"></div>

<main id="main">
  <section class="hero2">
    <div class="bgwrap grid-bg grid-fade" aria-hidden="true"></div>
    <div class="wrap">
      <div>
        <span class="pill hero-in" data-i18n="home.pill"></span>
        <h1 class="hero-in d1"><span data-i18n="home.title1"></span><span data-i18n="home.title2"></span></h1>
        <p class="lede hero-in d2" data-i18n="home.lede"></p>
        <div class="cta hero-in d3">
          <a class="btn" href="programs.html" data-i18n="home.ctaPrograms"></a>
          <a class="btn ghost" href="gallery.html" data-i18n="home.ctaDesigns"></a>
        </div>
        <div class="facts-row hero-in d4" id="facts"></div>
      </div>
      <div class="hero-stage hero-in d2">
        <div class="plate" aria-hidden="true"></div>
        <div class="ring" aria-hidden="true"></div>
        <img class="ill" src="assets/img/hero-city.webp" alt="Illustration of green towers, trees and wind turbines" width="883" height="767" fetchpriority="high">
      </div>
    </div>
  </section>

  <section class="section tint">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.howTitle"></h2>
          <p data-i18n="home.howLede"></p>
        </div>
      </div>
      <ol class="process">
        <li><span class="num">1</span><h3 data-i18n="home.step1.title"></h3><p data-i18n="home.step1.body"></p><a class="textlink" href="gallery.html#sites" data-i18n="programs.match.cta"></a></li>
        <li><span class="num">2</span><h3 data-i18n="home.step2.title"></h3><p data-i18n="home.step2.body"></p><a class="textlink" href="apply.html#education" data-i18n="apply.edu.title"></a></li>
        <li><span class="num">3</span><h3 data-i18n="home.step3.title"></h3><p data-i18n="home.step3.body"></p><a class="textlink" href="apply.html" data-i18n="nav.apply"></a></li>
      </ol>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.sitesTitle"></h2>
          <p data-i18n="home.sitesLede"></p>
        </div>
        <a class="btn ghost sm" href="gallery.html#sites" data-i18n="home.sitesAll"></a>
      </div>
      <div class="site-cards" id="home-sites"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.projectsTitle"></h2>
          <p data-i18n="home.projectsLede"></p>
        </div>
        <a class="btn ghost sm" href="gallery.html" data-i18n="home.galleryAll"></a>
      </div>
      <div class="grid-3" id="home-featured"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="cs-band">
        <div>
          <h2 data-i18n="home.casesTitle"></h2>
          <p data-i18n="home.casesBody"></p>
          <a class="btn light" href="case-studies.html" data-i18n="home.casesCta"></a>
        </div>
        <div>
          <div class="cs-dots" id="home-dots" aria-hidden="true"></div>
          <div class="cs-dots-legend">
            <span><i style="background:#4FA067"></i><b id="n-s"></b>&nbsp;<span data-i18n="home.casesSuccess"></span></span>
            <span><i style="background:#E0B04F"></i><b id="n-m"></b>&nbsp;<span data-i18n="home.casesMixed"></span></span>
            <span><i style="background:#E36A5C"></i><b id="n-f"></b>&nbsp;<span data-i18n="home.casesFailure"></span></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section tint">
    <div class="wrap">
      <div class="split">
        <div class="split-text">
          <h2 data-i18n="home.aboutTitle"></h2>
          <p data-i18n="home.aboutBody"></p>
          <a class="btn" href="about.html" data-i18n="common.learnMore"></a>
        </div>
        <div class="split-media"><img src="assets/img/home-about.webp" alt="Paper-craft city of green buildings and leaves" loading="lazy" width="1000" height="667"></div>
      </div>
    </div>
  </section>

  <section class="quote">
    <div class="wrap">
      <blockquote data-i18n="home.quote"></blockquote>
      <p data-i18n="home.quoteSub"></p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn" href="apply.html#design" data-i18n="join.primary"></a>
        <a class="btn ghost" href="apply.html#education" data-i18n="apply.edu.title"></a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
