<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · URSPACE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B4F24">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAFAF7;color:#1B1F1C;
    font-family:"DM Sans",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px}
  .logo{font-size:30px;font-weight:700;color:#0B4F24;text-decoration:none}
  h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.02em;margin:28px 0 10px}
  p{color:#5B635D;margin:0 0 26px}
  a.btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;background:#0B4F24;color:#fff;font-weight:600;text-decoration:none}
</style>
<script>
  // A clean address like /privacy that the host doesn't serve directly:
  // try the matching .html file once before showing this page.
  (function () {
    var p = location.pathname, key = "tried:" + p, tried = false;
    try { tried = !!sessionStorage.getItem(key); sessionStorage.setItem(key, "1"); } catch (e) {}
    if (/\/[\w\-]+$/.test(p) && !tried) location.replace(p + ".html" + location.search + location.hash);
  })();
</script>
</head>
<body>
  <main>
    <a class="logo" href="/">URSPACE</a>
    <h1>This page doesn't exist</h1>
    <p>페이지를 찾을 수 없습니다. The link may be old or mistyped.</p>
    <a class="btn" href="/">Go to the home page</a>
  </main>
</body>
</html>
